# OPSIONAL: bangunkan Render tiap 5 menit lewat GitHub Actions.
# Pasang secret RENDER_URL (contoh: https://nama-app.onrender.com) di Settings > Secrets and variables > Actions.
name: keepalive
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render
        run: curl -fsS --retry 3 --max-time 60 "${{ secrets.RENDER_URL }}/health" || true
